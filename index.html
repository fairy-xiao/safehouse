<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F7FB">
<title>安全屋 · 新员工的第一周</title>
<style>
  :root{
    --bg:#F4F7FB; --surface:#FFFFFF; --line:#E6ECF5; --line2:#E1E8F2;
    --ink:#0E1A2B; --ink2:#33425C; --ink3:#7A889E; --ink4:#93A1B5;
    --teal:#0FA8A0; --tealD:#0B7F79; --tealBg:#F1FAF9; --tealLine:#CFEDE9;
    --blue:#2F6FEB; --green:#0F7A3D; --amber:#B4690E; --red:#B42318;
    --shadow:0 20px 44px -28px rgba(16,32,58,.36), 0 2px 4px rgba(16,32,58,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.7;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:linear-gradient(rgba(30,60,110,.045) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(30,60,110,.045) 1px,transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(circle at 50% 28%,#000 30%,transparent 85%);
    -webkit-mask-image:radial-gradient(circle at 50% 28%,#000 30%,transparent 85%);
  }
  body::after{
    content:"";position:fixed;inset:-25%;z-index:0;pointer-events:none;
    background:radial-gradient(620px 420px at 16% 0%,rgba(15,168,160,.12),transparent 62%),
               radial-gradient(720px 520px at 94% 100%,rgba(47,111,235,.10),transparent 62%);
  }
  .app{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:22px 20px 28px;
       min-height:100vh;display:flex;flex-direction:column;gap:16px}

  /* ---------- 顶部状态栏 ---------- */
  .hud{display:flex;align-items:center;gap:18px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.04em;font-size:15px;white-space:nowrap;color:var(--ink)}
  .brand .pulse{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 0 rgba(15,168,160,.5);animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(15,168,160,.45)}70%{box-shadow:0 0 0 9px rgba(15,168,160,0)}100%{box-shadow:0 0 0 0 rgba(15,168,160,0)}}
  .brand em{font-style:normal;font-size:10px;letter-spacing:.18em;color:var(--ink4);font-weight:600}
  .meter{flex:1;position:relative}
  .meter-label{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink3);margin-bottom:6px}
  .meter-label b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
  .bar{height:7px;border-radius:99px;background:#E6ECF5;overflow:hidden}
  .bar i{display:block;height:100%;width:50%;border-radius:99px;transition:width .55s cubic-bezier(.22,1,.36,1),background .4s}
  .flash{position:absolute;right:-2px;top:-9px;font-size:13px;font-weight:800;animation:fly 1s ease forwards;pointer-events:none}
  @keyframes fly{0%{opacity:0;transform:translateY(8px)}18%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}

  /* ---------- 关卡进度 ---------- */
  .track{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink4)}
  .track .seg{width:26px;height:5px;border-radius:99px;background:#E3EAF4;transition:.3s}
  .track .seg.now{background:var(--teal);box-shadow:0 0 0 3px rgba(15,168,160,.15)}
  .track .seg.past{background:rgba(47,111,235,.28)}
  .track .seg.past.good{background:#16A34A}
  .track .seg.past.bad{background:#DC2626}
  .track .seg.past.warn{background:#D97706}
  .track .txt{margin-left:6px}

  /* ---------- 卡片 ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--line);border-radius:22px;padding:30px 30px 26px;
    box-shadow:var(--shadow);
    animation:rise .45s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .place{font-size:12px;color:var(--ink3);letter-spacing:.02em}
  .pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;letter-spacing:.06em}
  .pill.good{background:#E9F9EF;color:var(--green);border:1px solid #B7E4C9}
  .pill.bad{background:#FDECEC;color:var(--red);border:1px solid #F3C6C2}
  .pill.warn{background:#FEF4E3;color:var(--amber);border:1px solid #F0D9AC}
  .title{margin:0 0 16px;font-size:25px;line-height:1.4;letter-spacing:-.01em;color:var(--ink)}
  .card.bad .title{color:var(--red)}
  .card.good .title{color:var(--green)}
  .card.warn .title{color:var(--amber)}
  .body p{margin:0 0 12px;color:var(--ink2);font-size:15.5px;animation:rise .5s cubic-bezier(.22,1,.36,1) both}
  .body p:last-child{margin-bottom:0}
  .body strong{color:var(--tealD);font-weight:700}
  .card.bad .body strong{color:var(--red)}

  /* 知识点 */
  .tip{margin-top:20px;padding:14px 16px;border-radius:14px;font-size:13.5px;line-height:1.7;
       background:var(--tealBg);border:1px solid var(--tealLine);color:#3E5A66}
  .tip b{display:block;color:var(--tealD);font-size:11px;letter-spacing:.14em;margin-bottom:5px}

  /* ---------- 选项 ---------- */
  .choices{display:flex;flex-direction:column;gap:10px;margin-top:24px}
  .choice{
    display:flex;gap:13px;align-items:flex-start;text-align:left;width:100%;
    background:#FFFFFF;border:1px solid var(--line2);
    color:#22334A;padding:15px 17px;border-radius:15px;font-size:15px;line-height:1.6;
    cursor:pointer;font-family:inherit;transition:transform .16s,border-color .16s,background .16s,box-shadow .16s;
  }
  .choice:hover:not(:disabled){background:var(--tealBg);border-color:var(--teal);transform:translateY(-1px);
    box-shadow:0 8px 18px -12px rgba(15,168,160,.5)}
  .choice:active:not(:disabled){transform:scale(.995)}
  .choice:disabled{opacity:.45;cursor:default}
  .choice .k{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;
             font-size:12px;font-weight:700;background:#EDF2F9;color:#5B6B82;margin-top:1px}
  .choice:hover:not(:disabled) .k{background:rgba(15,168,160,.15);color:var(--tealD)}
  .choice .t{flex:1}
  .choice.next{justify-content:center;align-items:center;background:var(--teal);
               border-color:var(--teal);font-weight:700;color:#fff}
  .choice.next:hover{background:var(--tealD)}
  .choice.next .k{background:transparent;width:auto;color:#fff}

  /* ---------- 结局 ---------- */
  .end{text-align:left}
  .grade{display:flex;align-items:center;gap:18px;margin-bottom:6px}
  .grade .badge{width:74px;height:74px;border-radius:20px;display:grid;place-items:center;
                font-size:34px;font-weight:800;flex:none;background:#fff;
                border:2px solid var(--c);color:var(--c);
                box-shadow:0 12px 26px -14px var(--c)}
  .grade h2{margin:0;font-size:21px;color:var(--ink)}
  .grade small{display:block;color:var(--ink3);font-size:13px;margin-top:3px;font-weight:400}
  .final{font-size:13px;color:var(--ink3);margin:14px 0 0}
  .final b{font-size:26px;color:var(--ink);font-variant-numeric:tabular-nums;margin:0 3px}
  .verdict{color:var(--ink2);font-size:15px;margin:10px 0 0}
  .end h3{font-size:12px;letter-spacing:.16em;color:var(--ink4);margin:26px 0 10px;font-weight:700}
  .review{list-style:none;margin:0;padding:0;display:grid;gap:6px}
  .review li{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink2)}
  .review li i{font-style:normal;width:18px;text-align:center}
  .review .g{color:var(--green)}.review .b{color:var(--red)}.review .w{color:var(--amber)}
  .leaks{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px}
  .leaks li{font-size:12.5px;padding:5px 11px;border-radius:8px;background:#FDECEC;
            border:1px solid #F3C6C2;color:var(--red)}
  .cards{display:grid;gap:10px}
  .kcard{display:flex;gap:12px;padding:13px 15px;border-radius:13px;background:#F8FAFD;
         border:1px solid var(--line)}
  .kcard .ic{font-size:17px;line-height:1.4}
  .kcard b{display:block;font-size:13.5px;color:var(--ink);margin-bottom:2px}
  .kcard span{font-size:12.5px;color:var(--ink3);line-height:1.65}
  .chant{margin-top:22px;padding:15px;border-radius:14px;text-align:center;font-size:13.5px;
         letter-spacing:.06em;color:var(--tealD);background:var(--tealBg);
         border:1px dashed #9ADFD8}
  .end .acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .end .acts button{flex:1;min-width:130px;padding:13px;border-radius:12px;font-family:inherit;
                    font-size:14px;font-weight:700;cursor:pointer;transition:.16s}
  .btn-main{background:var(--teal);color:#fff;border:0}
  .btn-main:hover{background:var(--tealD)}
  .btn-ghost{background:#fff;color:#4A5A72;border:1px solid #D8E2EF}
  .btn-ghost:hover{background:#F4F8FC;border-color:#B9C9DC;color:var(--ink)}

  .foot{margin-top:auto;padding-top:8px;text-align:center;font-size:11.5px;color:var(--ink4)}
  .foot button{background:none;border:0;color:var(--ink3);font-family:inherit;font-size:11.5px;
               cursor:pointer;text-decoration:underline;padding:0 4px}
  .foot button:hover{color:var(--ink)}

  @media (max-width:560px){
    .app{padding:16px 14px 20px}
    .card{padding:24px 20px 22px;border-radius:18px}
    .title{font-size:21px}
    .body p{font-size:15px}
    .brand em{display:none}
    .grade .badge{width:62px;height:62px;font-size:28px;border-radius:16px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="brand"><span class="pulse"></span>安全屋<em>SAFE HOUSE</em></div>
    <div class="meter">
      <div class="meter-label"><span>安全分</span><b id="scoreVal">50</b></div>
      <div class="bar"><i id="scoreBar"></i></div>
    </div>
  </header>

  <div class="track" id="track"></div>
  <main class="stage" id="stage"></main>
  <footer class="foot">每个选择都会改变结局 · <button id="resetBtn">重新开始</button></footer>
</div>

<noscript><p style="padding:40px;text-align:center">请启用 JavaScript 后重新打开本页面。</p></noscript>

<script>
(function () {
  'use strict';

  /* =====================================================================
     剧本数据 —— 想改台词、加关卡，改这里就够了
     ---------------------------------------------------------------------
     每个场景是一个节点，格式：
       ch      : 第几关（1-6）
       place   : 顶部显示的时间地点
       title   : 标题
       body    : 正文段落，数组，一个元素一段
       choices : 选项数组，{t:选项文字, next:跳转的节点, score:扣分(负数), leak:泄露了什么}
                 正确选项写 score: 0（不扣分），错误选项扣 12-20 分。
       tip     : 知识点（可以不写）
       tone    : 结果节点用，可选 good / bad / warn
       res     : 结果节点用，good / bad / warn，用于最后复盘
       name    : 结果节点用，复盘里显示的场景名
       next    : 只有一个「继续」按钮时，点击后去哪
     正文里可以用 **两个星号** 包裹要加粗的字。
     ===================================================================== */

  var START_SCORE = 100; // 满分起步，做错才扣分

  var STORY = {

    /* ---------- 序章 ---------- */
    intro: {
      ch: 0,
      place: '周一 09:00 · 星海科技 前台',
      title: '入职第一天',
      body: [
        '你叫林小满，今天是你入职星海科技的第一天。',
        'HR 在邮件里说：上午先熟悉环境，下午三点到三楼会议室签合同。',
        '你在工位坐下，电脑还没开机，手机先震了一下。'
      ],
      choices: [{ t: '打开手机看看', next: 'mail' }]
    },

    /* ---------- 第 1 关：钓鱼邮件 ---------- */
    mail: {
      ch: 1,
      place: '周一 09:12 · 公司邮箱',
      title: '一封「入职材料」邮件',
      body: [
        '发件人：HR-人事部 <hr@xinghai-hr-service.com>',
        '主题：【紧急】请于今日 12:00 前提交入职材料，逾期视为放弃录用',
        '正文：尊敬的用户，请下载附件《入职材料.zip》，解压密码 123456，填写后回传。感谢配合。',
        '附件 3MB，你的鼠标停在上面。'
      ],
      choices: [
        { t: '直接解压，赶紧填完省事', next: 'r_mail_bad', score: -16, leak: '电脑被植入远控木马' },
        { t: '先看发件人域名：公司域名是 xinghai.com，这个多了「-hr-service」', next: 'r_mail_good', score: 0 },
        { t: '回一封邮件问对方：这是真的吗？', next: 'r_mail_reply', score: -12, leak: '身份证与银行卡信息' }
      ]
    },
    r_mail_bad: {
      ch: 1, tone: 'bad', res: 'bad', name: '钓鱼邮件',
      place: '周一 09:20 · 工位',
      title: '你解压了那个文件',
      body: [
        '压缩包里是一个带宏的 Word 文档，你点了「启用编辑」。',
        '十分钟后电脑开始卡顿——远控木马已经把你的桌面截图和键盘记录发给了攻击者。',
        '下午真正的 HR 见到你：「入职材料？我没发过这封邮件啊。」'
      ],
      tip: '钓鱼邮件三件套：仿冒域名、制造紧迫感、诱导打开附件。带密码的压缩包 + .docm / .exe 附件，是绕过邮件网关的常见手法。',
      next: 'boss'
    },
    r_mail_good: {
      ch: 1, tone: 'good', res: 'good', name: '钓鱼邮件',
      place: '周一 09:20 · 工位',
      title: '你发现了破绽',
      body: [
        '你放大了发件人地址：**xinghai-hr-service.com**，而公司真实域名是 **xinghai.com**。',
        '多出来的「-hr-service」是攻击者抢注的仿冒域名；正文还用了「尊敬的用户」这种群发称呼。',
        '你把邮件转发给 IT 安全组。五分钟后，全员收到预警：这是一封钓鱼邮件，请勿点击。'
      ],
      tip: '核实身份不要用对方提供的渠道：邮件里的电话、邮件里的链接，都可能指向骗子。正确做法是走公司内网、通讯录或当面确认。',
      next: 'boss'
    },
    r_mail_reply: {
      ch: 1, tone: 'bad', res: 'bad', name: '钓鱼邮件',
      place: '周一 09:26 · 工位',
      title: '「核实」本身就是陷阱',
      body: [
        '对方很快回复：「是的，请把身份证正反面和银行卡号发我，我帮你加急录入。」',
        '你照做了。第二天，你接到一个能准确报出你全部信息的「银行客服」电话——你的资料已经被转卖。'
      ],
      tip: '骗子最爱「核实」这一步。你以为在验证对方，其实是在把信息主动交出去。',
      next: 'boss'
    },

    /* ---------- 第 2 关：冒充领导 ---------- */
    boss: {
      ch: 2,
      place: '周一 14:30 · 微信',
      title: '「张总」的转账请求',
      body: [
        '一个头像和昵称都是「张总」的人加了你微信，验证消息写着「小满，加一下」。',
        '通过后对方立刻发来消息：',
        '「我在外地开会不方便接电话。有个供应商的款要先垫 2 万，明天财务就还你。卡号发你了，**别声张**。」',
        '你翻了翻手机通讯录——张总的号码你其实存过。'
      ],
      choices: [
        { t: '领导开口了，先转过去再说', next: 'r_boss_bad', score: -20, leak: '2 万元转账' },
        { t: '打通讯录里存的号码，核实一下', next: 'r_boss_good', score: 0 },
        { t: '在微信里问他一句：您真是张总吗？', next: 'boss_pressure' }

    },
    boss_pressure: {
      ch: 2,

        '紧接着发来一张转账截图：「我已经转给你了，银行延迟到账，你先垫一下。」',
        '语气越来越急，还连发了三个问号。'
      ],
      choices: [
        { t: '都有截图了，应该没问题，转', next: 'r_boss_bad2', score: -20, leak: '2 万元转账' },
        { t: '截图也能 P，还是打电话核实', next: 'r_boss_good2', score: -5 }
      ]
    },
    r_boss_bad: {
      ch: 2, tone: 'bad', res: 'bad', name: '冒充领导',
      place: '周一 14:40 · 微信',
      title: '对方收钱后消失了',
      body: [
        '你转了 2 万。对方回了个「收到，明天还你」，然后头像变灰。',
        '第二天打开微信，那个号变成红色感叹号——账号已注销。',
        '真正的张总说：我从来没加过你微信。'
      ],
      tip: '冒充领导诈骗的核心是「权威 + 紧迫 + 保密」：不让你打电话、不让你声张、不给你思考时间。凡是要转账，必须换一个渠道核实。',
      next: 'wifi'
    },
    r_boss_bad2: {
      ch: 2, tone: 'bad', res: 'bad', name: '冒充领导',
      place: '周一 14:44 · 微信',
      title: '截图是假的',
      body: [
        '那张「转账截图」是用生成器做的，两分钟就能 P 一张。',
        '你转过去的 2 万，十分钟内被拆分到四个账户，再也追不回来。'
      ],
      tip: '截图、到账短信、语音条都可以伪造。唯一可靠的验证是：用你自己掌握的、独立于对方提供的联系方式去确认。',
      next: 'wifi'
    },
    r_boss_good: {
      ch: 2, tone: 'good', res: 'good', name: '冒充领导',
      place: '周一 14:38 · 工位',
      title: '一个电话拆穿了骗局',
      body: [
        '电话接通，张总一头雾水：「我没让你转账，那是骗子。」',
        '你把聊天记录截图发给了行政和财务。当天下午，公司发了全员反诈提醒，你的案例被做成了培训素材。'
      ],
      tip: '「换渠道核实」是反诈的核心动作：微信说的用电话核实，电话说的当面核实。骗子能仿冒头像和昵称，仿冒不了你通讯录里的号码。',
      next: 'wifi'
    },
    r_boss_good2: {
      ch: 2, tone: 'good', res: 'good', name: '冒充领导',
      place: '周一 14:46 · 工位',
      title: '你没被催乱',
      body: [
        '你拨通通讯录里的号码，张总说他在开会，从没让你转过账。',
        '你顺手举报了那个微信号，系统提示：该账号已被 3 人标记为诈骗。'
      ],
      tip: '「催」是骗子最常用的武器。越急的事，越要慢一步核实——真正的急事，经得起一个电话。',
      next: 'wifi'
    },

    /* ---------- 第 3 关：公共 WiFi ---------- */
    wifi: {
      ch: 3,
      place: '周一 19:40 · 楼下咖啡馆',

  var stage = document.getElementById('stage');

  var track = document.getElementById('track');
  var meter = document.querySelector('.meter');
  var S = null;

  function reset() {
    S = { score: START_SCORE, leaks: [], log: [], ch: 0 };
    scoreVal.textContent = S.score;
    paintBar();
    go('intro');
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function fmt(s) {
    return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  }

  function paintBar() {
    var s = S.score;
    scoreBar.style.width = Math.max(2, s) + '%';
    scoreBar.style.background = s >= 75
      ? 'linear-gradient(90deg,#0FA8A0,#2F6FEB)'
      : s >= 55
        ? 'linear-gradient(90deg,#F2B01E,#E08A00)'
        : 'linear-gradient(90deg,#E4574C,#B42318)';
  }

  function flash(delta) {
    if (!delta) return;
    var el = document.createElement('span');
    el.className = 'flash';
    el.textContent = (delta > 0 ? '+' : '') + delta;
    el.style.color = delta > 0 ? '#0F7A3D' : '#B42318';
    meter.appendChild(el);
    setTimeout(function () { el.remove(); }, 1000);
  }

  function choose(i) {
    var node = STORY[S.node];
    if (!node || !node.choices) return;
    var c = node.choices[i];
    if (!c) return;

    if (c.score) {
      S.score = Math.max(0, Math.min(100, S.score + c.score));
      scoreVal.textContent = S.score;
      paintBar();
      flash(c.score);
    }
    if (c.leak) S.leaks.push(c.leak);

    document.querySelectorAll('.choice').forEach(function (b) { b.disabled = true; });
    setTimeout(function () { go(c.next); }, c.score ? 180 : 0);
  }

  function renderTrack() {
    var names = ['邮件', '转账', 'WiFi', '来电', '密码', 'U盘'];
    var html = '';
    for (var i = 0; i < 6; i++) {
      var cls = 'seg';
      if (S.log[i]) cls += ' past ' + S.log[i].res;
      if (S.ch === i + 1) cls += ' now';
      html += '<span class="' + cls + '" title="' + names[i] + '"></span>';
    }
    var label = S.ch <= 0 ? '准备中' : (S.ch >= 6 ? '本周结束' : '场景 ' + S.ch + ' / 6');
    html += '<span class="txt">' + label + '</span>';
    track.innerHTML = html;
  }

  function go(id) {
    var n = STORY[id];
    if (!n) { console.error('找不到节点：' + id); return; }
    S.node = id;
    if (n.ch > S.ch) S.ch = n.ch;
    if (n.res) S.log[n.ch - 1] = { res: n.res, name: n.name };
    renderTrack();
    if (n.ending) { renderEnding(); return; }
    renderScene(n);
  }

  var TONE_TEXT = { good: '✓ 处理正确', bad: '✕ 中招了', warn: '! 差一点' };

  function renderScene(n) {
    var html = '<section class="card ' + (n.tone || '') + '">';
    html += '<div class="meta"><span class="place">' + esc(n.place) + '</span>';
    if (n.res) html += '<span class="pill ' + n.res + '">' + TONE_TEXT[n.res] + '</span>';
    html += '</div>';
    html += '<h1 class="title">' + fmt(n.title) + '</h1>';
    html += '<div class="body">';
    n.body.forEach(function (p, i) {
      html += '<p style="animation-delay:' + (i * 70) + 'ms">' + fmt(p) + '</p>';
    });
    html += '</div>';

    if (n.tip) {
      html += '<div class="tip"><b>知识点</b>' + fmt(n.tip) + '</div>';
    }

    html += '<div class="choices">';
    if (n.choices) {
      n.choices.forEach(function (c, i) {
        html += '<button class="choice" data-i="' + i + '">' +
                '<span class="k">' + (i + 1) + '</span>' +
                '<span class="t">' + fmt(c.t) + '</span></button>';
      });
    } else {
      html += '<button class="choice next" id="nextBtn"><span class="t">继续</span>' +
              '<span class="k">→</span></button>';
    }
    html += '</div></section>';

    stage.innerHTML = html;

    stage.querySelectorAll('.choice[data-i]').forEach(function (btn) {
      btn.addEventListener('click', function () { choose(Number(btn.dataset.i)); });
    });
    var nb = document.getElementById('nextBtn');
    if (nb) nb.addEventListener('click', function () { go(n.next); });
  }

    if (s >= 90) return { k: 'S', name: '安全标兵', c: '#0F7A3D', line: '这一周，你几乎没有给攻击者留下任何机会。' };
    if (s >= 75) return { k: 'A', name: '老练打工人', c: '#0B7F79', line: '大部分陷阱你都识破了，个别环节还能再稳一点。' };
    if (s >= 55) return { k: 'B', name: '惊险过关', c: '#B4690E', line: '你踩了几个坑，好在还来得及补。' };
    return { k: 'C', name: '年度最佳受害者', c: '#B42318', line: '这一周，攻击者在你身上完成了 KPI。' };
  }

    document.getElementById('shareBtn').addEventListener('click', function () {
      var txt = '我在《安全屋 · 新员工的第一周》拿到 ' + g.k + ' 级（' + S.score + ' 分），' +
                '踩了 ' + S.leaks.length + ' 个坑。你能拿几分？';
      navigator.clipboard && navigator.clipboard.writeText(txt).then(function () {
        document.getElementById('shareBtn').textContent = '已复制 ✓';
      }).catch(function () {
        document.getElementById('shareBtn').textContent = txt;
      });
    });

    try {
      var best = Number(localStorage.getItem('safehouse_best') || 0);
      if (S.score > best) localStorage.setItem('safehouse_best', String(S.score));
    } catch (e) { /* 本地文件模式下可能不可用，忽略 */ }

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* 键盘：1-4 选择，回车继续 */
  document.addEventListener('keydown', function (e) {
    if (e.key >= '1' && e.key <= '4') {
      var btn = document.querySelector('.choice[data-i="' + (Number(e.key) - 1) + '"]');
      if (btn) btn.click();
    }
    if (e.key === 'Enter') {
      var nb = document.getElementById('nextBtn');
      if (nb) nb.click();
    }
  });

  document.getElementById('resetBtn').addEventListener('click', reset);

  reset();
})();
</script>
</body>
</html>
